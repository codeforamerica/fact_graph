name: Ruby Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories land without any change to this repo, so check daily.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check Ruby and RubyGems for known vulnerabilities
        run: |
          ruby -v
          bundle exec ruby-audit check
