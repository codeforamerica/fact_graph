name: Ruby Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories land without any change to this repo, so check daily.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from .ruby-version.
      - uses: ruby/setup-ruby@v1

      - name: Install ruby_audit
        run: gem install ruby_audit

      # Run outside the checkout so the project's Gemfile doesn't interfere
      # with loading the globally installed ruby_audit gem.
      - name: Check Ruby and RubyGems for known vulnerabilities
        working-directory: ${{ runner.temp }}
        run: |
          ruby -v
          ruby-audit check
