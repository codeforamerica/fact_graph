name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories land without any change to this repo, so check daily.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from .ruby-version.
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop

  ruby-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from .ruby-version.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check Ruby and RubyGems for known vulnerabilities
        run: |
          ruby -v
          bundle exec ruby-audit check
